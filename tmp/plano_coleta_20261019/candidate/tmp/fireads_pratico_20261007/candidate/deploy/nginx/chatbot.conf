# Substitua __DOMAIN__ pelo dominio publico antes de habilitar este site.
# Este arquivo inicia somente em HTTP. Depois que o DNS estiver propagado,
# `certbot --nginx --redirect -d SEU_DOMINIO` adicionara o listener HTTPS:443
# junto com os caminhos do certificado que ele proprio emitir.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 2m;

    location ^~ /static/ {
        alias /opt/chatbot/app/callback/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
